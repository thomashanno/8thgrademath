<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rounding Decimals Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .instruction {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #666;
    }

    .problem-display {
      font-size: 32px;
      font-weight: bold;
      color: #111;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0 15px 0;
    }

    /* Canvas Container */
    .canvas-container {
      margin: 10px 0 15px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background-color: #ffffff;
      border-radius: 8px;
    }

    /* Toggle Helper Button */
    .toggle-line-btn {
      margin-top: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #007bff;
      background-color: #eef6ff;
      border: 1px solid #007bff;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-line-btn:hover {
      background-color: #007bff;
      color: white;
    }

    input[type="text"] {
      font-size: 22px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }

    /* Input feedback states */
    input[type="text"].input-correct {
      border-color: #28a745 !important;
      background-color: #e8f8ec !important;
      color: #155724;
    }
    input[type="text"].input-incorrect {
      border-color: #dc3545 !important;
      background-color: #fdf2f2 !important;
      color: #721c24;
    }

    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }

    /* Keypad Layout */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 22px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      min-height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.4;
      padding: 0 5px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Rounding Decimals Practice</h2>
  <p class="instruction">Round the decimal below to the <strong>nearest tenth</strong>.</p>

  <div class="problem-display" id="problemNum">0.00</div>

  <div class="canvas-container">
    <canvas id="numberLineCanvas" width="320" height="65" style="display: none;"></canvas>
    <button type="button" class="toggle-line-btn" id="toggleLineBtn">📏 Show Number Line</button>
  </div>
  
  <form id="answerForm">
    <input type="text" id="userInput" placeholder="Type rounded answer..." autocomplete="off">
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>

      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>

      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn" data-val=".">.</button>
      <button type="button" class="key-btn" data-val="0">0</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit Answer</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="https://thomashanno.github.io/8thgrademath/index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentProblem = null;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  let attemptsOnCurrentProblem = 0;
  let showNumberLine = false;

  const userInput = document.getElementById('userInput');
  const canvas = document.getElementById('numberLineCanvas');
  const ctx = canvas.getContext('2d');
  const toggleLineBtn = document.getElementById('toggleLineBtn');
  const problemNumEl = document.getElementById('problemNum');
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function resetInputStyle() {
    userInput.classList.remove('input-correct', 'input-incorrect');
  }

  // Draw Number Line Scaffold Canvas
  function drawNumberLine(numVal, numStr) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const lowerTenth = Math.floor(numVal * 10) / 10;
    const upperTenth = Math.round((lowerTenth + 0.1) * 10) / 10;

    const pad = 35;
    const lineY = 32;
    const lineLen = canvas.width - (2 * pad);

    // Axis Line
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pad, lineY);
    ctx.lineTo(canvas.width - pad, lineY);
    ctx.stroke();

    function getX(val) {
      return pad + ((val - lowerTenth) / 0.1) * lineLen;
    }

    ctx.font = 'bold 11px Arial';
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';

    // Lower Tenth Tick
    const x1 = getX(lowerTenth);
    ctx.beginPath(); ctx.moveTo(x1, lineY - 6); ctx.lineTo(x1, lineY + 6); ctx.stroke();
    ctx.fillText(lowerTenth.toFixed(1), x1, lineY + 20);

    // Upper Tenth Tick
    const x2 = getX(upperTenth);
    ctx.beginPath(); ctx.moveTo(x2, lineY - 6); ctx.lineTo(x2, lineY + 6); ctx.stroke();
    ctx.fillText(upperTenth.toFixed(1), x2, lineY + 20);

    // Target Value Dot
    const px = getX(numVal);
    ctx.beginPath();
    ctx.arc(px, lineY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#dc3545';
    ctx.fill();

    ctx.fillText(numStr, px, lineY - 10);
  }

  function generateProblem() {
    const whole = getRandomInt(1, 19);
    const placeCount = getRandomInt(2, 3); // Decimals with 2 or 3 places (e.g. 5.23 or 6.709)
    
    let decDigits = [];
    for (let i = 0; i < placeCount; i++) {
      decDigits.push(getRandomInt(0, 9));
    }

    const numStr = whole + '.' + decDigits.join('');
    const numVal = parseFloat(numStr);
    const roundedVal = (Math.round(numVal * 10) / 10).toFixed(1);

    const hundredthsDigit = decDigits[1];
    const isUp = hundredthsDigit >= 5;

    const ruleText = isUp ? '>= 5, round up!' : '< 5, keep it the same!';
    const hintMsg = '💡 <strong>Hint:</strong> Look at the hundredths digit (<strong>' + hundredthsDigit + '</strong>). Since ' + hundredthsDigit + ' ' + ruleText;
    const explanationMsg = 'Correct! <strong>' + numStr + '</strong> rounded to the nearest tenth is <strong>' + roundedVal + '</strong>';

    currentProblem = {
      numStr: numStr,
      numVal: numVal,
      expectedAnswer: roundedVal,
      hundredthsDigit: hundredthsDigit,
      hintText: hintMsg,
      explanation: explanationMsg
    };

    problemNumEl.textContent = numStr;

    showNumberLine = false;
    canvas.style.display = 'none';
    toggleLineBtn.textContent = '📏 Show Number Line';

    drawNumberLine(numVal, numStr);
    attemptsOnCurrentProblem = 0;
    userInput.value = '';
    resetInputStyle();

    if (!isMobile) {
      userInput.focus();
    }
  }

  toggleLineBtn.addEventListener('click', function() {
    showNumberLine = !showNumberLine;
    canvas.style.display = showNumberLine ? 'block' : 'none';
    toggleLineBtn.textContent = showNumberLine ? '🙈 Hide Number Line' : '📏 Show Number Line';
  });

  function evaluateAnswer(userAnswer) {
    const feedback = document.getElementById('feedback');
    const cleanUser = userAnswer.trim();
    
    const numUser = parseFloat(cleanUser);
    const numExpected = parseFloat(currentProblem.expectedAnswer);
    const isCorrect = !isNaN(numUser) && Math.abs(numUser - numExpected) < 0.001;

    attemptsOnCurrentProblem++;

    if (isCorrect) {
      feedback.innerHTML = currentProblem.explanation;
      feedback.className = "feedback correct";
      
      userInput.classList.remove('input-incorrect');
      userInput.classList.add('input-correct');

      if (attemptsOnCurrentProblem === 1) {
        total++;
        correct++;
        streak++;
      } else {
        streak++;
      }
      
      updateStats();
      setTimeout(() => {
        feedback.innerHTML = "";
        generateProblem();
      }, 1600);
    } else {
      userInput.classList.remove('input-correct');
      userInput.classList.add('input-incorrect');

      if (attemptsOnCurrentProblem === 1) {
        feedback.innerHTML = currentProblem.hintText;
        feedback.className = "feedback incorrect";
        
        total++;
        incorrect++;
        streak = 0;
        updateStats();
      } else {
        feedback.innerHTML = 'Incorrect. <strong>' + currentProblem.numStr + '</strong> rounded to the nearest tenth is <strong>' + currentProblem.expectedAnswer + '</strong>';
        feedback.className = "feedback incorrect";
        
        streak = 0;
        updateStats();
      }
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Keypad Handlers
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      resetInputStyle();
      const val = this.getAttribute('data-val');
      if (val === '.' && userInput.value.includes('.')) return;
      
      userInput.value += val;
      if (!isMobile) userInput.focus();
    });
  });

  document.getElementById('backspaceBtn').addEventListener('click', function() {
    resetInputStyle();
    userInput.value = userInput.value.slice(0, -1);
    if (!isMobile) userInput.focus();
  });

  userInput.addEventListener('input', resetInputStyle);

  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (userInput.value.trim() === '') return;
    evaluateAnswer(userInput.value);
  });

  generateProblem();
</script>

</body>
</html>
