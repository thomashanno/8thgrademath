<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integer Subtraction Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    .number-line-container {
      margin: 10px 0 20px 0;
      padding: 10px 15px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
    }
    .number-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      height: 45px;
      padding: 0 10px;
      min-width: 320px;
    }
    /* Main horizontal line */
    .number-line::before {
      content: '';
      position: absolute;
      bottom: 22px;
      left: 6px;
      right: 6px;
      height: 3px;
      background-color: #333;
      z-index: 1;
    }
    /* Left arrow head */
    .number-line::after {
      content: '';
      position: absolute;
      bottom: 18px;
      left: -2px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 10px solid #333;
      z-index: 2;
    }
    /* Right arrow head wrapper */
    .arrow-right {
      position: absolute;
      bottom: 18px;
      right: -2px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 10px solid #333;
      z-index: 2;
    }
    .tick-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      width: 0;
    }
    .tick {
      width: 2px;
      height: 12px;
      background-color: #333;
    }
    .tick.zero {
      height: 18px;
      width: 3px;
      background-color: #007bff;
    }
    .tick-label {
      font-size: 11px;
      margin-top: 4px;
      color: #555;
    }
    .tick-label.zero {
      font-weight: bold;
      color: #007bff;
    }
    .problem {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 45px;
    }
    input[type="text"] {
      font-size: 20px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    input[type="text"].input-correct {
      border-color: #28a745 !important;
      background-color: #d4edda !important;
      color: #155724;
    }
    input[type="text"].input-incorrect {
      border-color: #dc3545 !important;
      background-color: #f8d7da !important;
      color: #721c24;
    }
    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 20px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      height: 24px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Integer Operation Practice</h2>
  <p style="margin: 0 0 10px 0; font-size: 14px; color: #666;">Subtracting single digit integers</p>
  
  <!-- Number Line Display (-10 to +10) -->
  <div class="number-line-container">
    <div class="number-line" id="numberLine">
      <div class="arrow-right"></div>
    </div>
  </div>

  <div class="problem" id="problem">5 - (-3)</div>
  
  <form id="answerForm">
    <input type="text" id="userInput" placeholder="e.g. -4 or 7" autocomplete="off" required>
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      <button type="button" class="key-btn action" id="minusBtn">-</button>
      
      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
      
      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>
      <button type="button" class="key-btn" data-val="0">0</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="../index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentAnswer = 0;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  
  // Tracks if the student has already made their first attempt on the active problem
  let hasAttemptedCurrentProblem = false;

  const userInput = document.getElementById('userInput');

  // Detect mobile device to disable virtual keyboard popups on phones/tablets
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function clearInputStatus() {
    userInput.classList.remove('input-correct', 'input-incorrect');
  }

  // Generate the Number Line HTML (-10 to 10)
  function renderNumberLine() {
    const nl = document.getElementById('numberLine');
    let html = '<div class="arrow-right"></div>';
    for (let i = -10; i <= 10; i++) {
      const isZero = i === 0;
      const tickClass = isZero ? 'tick zero' : 'tick';
      const labelClass = isZero ? 'tick-label zero' : 'tick-label';
      const labelText = i > 0 ? `+${i}` : `${i}`;
      
      html += `
        <div class="tick-wrapper">
          <div class="${tickClass}"></div>
          <span class="${labelClass}">${labelText}</span>
        </div>
      `;
    }
    nl.innerHTML = html;
  }

  function getRandomInteger() {
    let num = 0;
    while (num === 0) {
      num = Math.floor(Math.random() * 19) - 9; // Range: -9 to 9
    }
    return num;
  }

  function formatNum(num, isFirst = false) {
    if (num < 0) {
      return isFirst ? `-${Math.abs(num)}` : `(${num})`;
    }
    return `${num}`;
  }

  function generateProblem() {
    const n1 = getRandomInteger();
    const n2 = getRandomInteger();

    currentAnswer = n1 - n2;
    hasAttemptedCurrentProblem = false; // Reset attempt tracker for new problem
    
    document.getElementById('problem').textContent = `${formatNum(n1, true)} - ${formatNum(n2)}`;
    userInput.value = '';
    clearInputStatus();

    if (!isMobile) {
      userInput.focus();
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Handle Keypad Digit Buttons
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      clearInputStatus();
      userInput.value += this.getAttribute('data-val');
      if (!isMobile) userInput.focus();
    });
  });

  // Handle Minus Button (Toggles leading negative sign or inserts '-')
  document.getElementById('minusBtn').addEventListener('click', function() {
    clearInputStatus();
    if (userInput.value.startsWith('-')) {
      userInput.value = userInput.value.slice(1);
    } else {
      userInput.value = '-' + userInput.value;
    }
    if (!isMobile) userInput.focus();
  });

  // Handle Backspace Button
  document.getElementById('backspaceBtn').addEventListener('click', function() {
    clearInputStatus();
    userInput.value = userInput.value.slice(0, -1);
    if (!isMobile) userInput.focus();
  });

  userInput.addEventListener('input', clearInputStatus);

  // Handle Answer Validation
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const rawInput = userInput.value.trim();
    const input = parseInt(rawInput, 10);
    const feedback = document.getElementById('feedback');

    if (isNaN(input)) return;

    if (input === currentAnswer) {
      userInput.classList.remove('input-incorrect');
      userInput.classList.add('input-correct');

      feedback.textContent = "Correct!";
      feedback.className = "feedback correct";
      
      if (!hasAttemptedCurrentProblem) {
        // First try was correct
        total++;
        correct++;
        streak++;
      } else {
        // Correct on a repeat try (doesn't increment total or correct counts)
        streak++;
      }
      
      updateStats();
      setTimeout(() => {
        feedback.textContent = "";
        generateProblem();
      }, 1000);
    } else {
      userInput.classList.remove('input-correct');
      userInput.classList.add('input-incorrect');

      // Show "Try again!" along with the expected answer
      feedback.textContent = `Try again! (Answer: ${currentAnswer})`;
      feedback.className = "feedback incorrect";
      
      if (!hasAttemptedCurrentProblem) {
        // First try was incorrect
        total++;
        incorrect++;
        hasAttemptedCurrentProblem = true; // Lock main counts for subsequent tries on this question
      }
      
      streak = 0;
      updateStats();
    }
  });

  renderNumberLine();
  generateProblem();
</script>

</body>
</html>
