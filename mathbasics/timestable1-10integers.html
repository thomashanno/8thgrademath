<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Times Tables Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .problem {
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0 10px 0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50px;
    }

    input[type="text"] {
      font-size: 20px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }
    
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 20px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      height: 24px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Times Tables Practice</h2>
  <p style="margin: 0 0 15px 0; font-size: 14px; color: #666;">Type the product and press Submit or Enter</p>
  
  <div class="problem" id="problem">3 • 7</div>

  <form id="answerForm">
    <input type="text" id="userInput" placeholder="e.g. 21" autocomplete="off" required>
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      
      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>
      
      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn" data-val="0" style="grid-column: span 2;">0</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="../index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentAnswer = "";
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;

  const userInput = document.getElementById('userInput');

  // Detect mobile device to disable virtual keyboard popups on phones/tablets
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateProblem() {
    // Numbers from 1 through 10
    const num1 = getRandomInt(1, 10);
    const num2 = getRandomInt(1, 10);

    const problemText = `${num1} • ${num2}`;
    currentAnswer = (num1 * num2).toString();

    document.getElementById('problem').textContent = problemText;
    userInput.value = '';
    
    if (!isMobile) {
      userInput.focus();
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Handle Keypad Buttons
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      userInput.value += this.getAttribute('data-val');
      if (!isMobile) userInput.focus();
    });
  });

  // Handle Backspace Button
  document.getElementById('backspaceBtn').addEventListener('click', function() {
    userInput.value = userInput.value.slice(0, -1);
    if (!isMobile) userInput.focus();
  });

  // Handle Answer Validation
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const input = userInput.value.trim();
    const feedback = document.getElementById('feedback');

    total++;

    if (input === currentAnswer) {
      feedback.textContent = "Correct!";
      feedback.className = "feedback correct";
      streak++;
      correct++;
      updateStats();
      setTimeout(() => {
        feedback.textContent = "";
        generateProblem();
      }, 1000);
    } else {
      feedback.textContent = `Try again! (Answer: ${currentAnswer})`;
      feedback.className = "feedback incorrect";
      streak = 0;
      incorrect++;
      updateStats();
    }
  });

  generateProblem();
</script>

</body>
</html>
