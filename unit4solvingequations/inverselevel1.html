<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identify the Inverse Operation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      transition: background-color 0.6s ease;
    }

    /* High Streak Milestone Background (Streak >= 10) */
    body.high-streak {
      background-color: #d4edda;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    body.high-streak .card {
      border: 2px solid #28a745;
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.25);
    }

    .streak-badge {
      display: none;
      background-color: #28a745;
      color: white;
      font-size: 13px;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      animation: pulse 2s infinite;
    }

    body.high-streak .streak-badge {
      display: inline-block;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .instruction {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #444;
      line-height: 1.4;
    }

    .problem-display {
      font-size: 32px;
      font-weight: bold;
      color: #111;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 18px 12px;
      margin: 15px 0 20px 0;
      letter-spacing: 0.5px;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Vinculum Fraction Styling for Division */
    .eq-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      align-items: center;
      line-height: 1.1;
    }
    .numerator {
      border-bottom: 2.5px solid #111;
      padding: 0 6px 2px 6px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .denominator {
      padding: 2px 6px 0 6px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    /* 2x2 Grid for Simple 4 Operations */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .option-btn {
      width: 100%;
      padding: 16px 10px;
      font-size: 18px;
      font-weight: bold;
      background-color: #ffffff;
      color: #333;
      border: 2px solid #ced4da;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
      user-select: none;
      touch-action: manipulation;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #eef6ff;
      border-color: #007bff;
      color: #007bff;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .option-btn.correct-choice {
      background-color: #e8f8ec !important;
      border-color: #28a745 !important;
      color: #155724 !important;
    }

    .option-btn.incorrect-choice {
      background-color: #fdf2f2 !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
    }

    .feedback {
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      min-height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.4;
      padding: 0 5px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }

    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }

    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="streak-badge" id="streakBadge">🌟 10+ Streak! Great job, time to switch activities!</div>
  <h2>Name the Inverse Operation</h2>
  <p class="instruction">Which operation undoes the equation to solve for <strong>x</strong>?</p>

  <div class="problem-display" id="problemDisplay"></div>

  <div class="options-grid" id="optionsContainer">
    <button type="button" class="option-btn" data-op="Add">Add</button>
    <button type="button" class="option-btn" data-op="Subtract">Subtract</button>
    <button type="button" class="option-btn" data-op="Multiply">Multiply</button>
    <button type="button" class="option-btn" data-op="Divide">Divide</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="https://thomashanno.github.io/8thgrademath/index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentProblem = null;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  let attemptsOnCurrentProblem = 0;
  let isTransitioning = false;

  const problemDisplayEl = document.getElementById('problemDisplay');
  const optionButtons = document.querySelectorAll('.option-btn');
  const feedbackEl = document.getElementById('feedback');

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function getRandomNonZero(min, max) {
    let val = 0;
    while (val === 0 || val === 1 || val === -1) {
      val = getRandomInt(min, max);
    }
    return val;
  }

  function resetOptionStyles() {
    optionButtons.forEach(btn => {
      btn.disabled = false;
      btn.classList.remove('correct-choice', 'incorrect-choice');
    });
  }

  function generateProblem() {
    isTransitioning = false;
    resetOptionStyles();
    feedbackEl.innerHTML = "";
    feedbackEl.className = "feedback";

    // 0: Addition (x + a = b)       -> Correct: Subtract
    // 1: Subtraction (x - a = b)    -> Correct: Add
    // 2: Multiplication (ax = b)    -> Correct: Divide
    // 3: Division (x / a = b)       -> Correct: Multiply
    const type = getRandomInt(0, 3);

    let htmlContent = "";
    let correctOp = "";
    let hintMsg = "";

    if (type === 0) {
      const a = getRandomInt(2, 20);
      const b = getRandomInt(-15, 30);
      htmlContent = `x + ${a} = ${b}`;
      correctOp = "Subtract";
      hintMsg = `💡 <strong>Hint:</strong> The equation uses addition (+ ${a}). What is the opposite of addition?`;

    } else if (type === 1) {
      const a = getRandomInt(2, 20);
      const b = getRandomInt(-15, 30);
      htmlContent = `x - ${a} = ${b}`;
      correctOp = "Add";
      hintMsg = `💡 <strong>Hint:</strong> The equation uses subtraction (- ${a}). What is the opposite of subtraction?`;

    } else if (type === 2) {
      const a = getRandomNonZero(-12, 12);
      const b = getRandomInt(-30, 30);
      htmlContent = `${a}x = ${b}`;
      correctOp = "Divide";
      hintMsg = `💡 <strong>Hint:</strong> ${a}x means ${a} times x (multiplication). What is the opposite of multiplication?`;

    } else {
      const a = getRandomNonZero(-12, 12);
      const b = getRandomInt(-15, 15);
      htmlContent = `<div class="eq-container"><div class="fraction"><span class="numerator">x</span><span class="denominator">${a}</span></div><span>=</span><span>${b}</span></div>`;
      correctOp = "Multiply";
      hintMsg = `💡 <strong>Hint:</strong> The fraction bar shows division by ${a}. What is the opposite of division?`;
    }

    problemDisplayEl.innerHTML = htmlContent;

    currentProblem = {
      correctOp: correctOp,
      hintText: hintMsg
    };

    attemptsOnCurrentProblem = 0;
  }

  function handleOptionSelect(selectedOp, clickedButton) {
    if (isTransitioning) return;

    attemptsOnCurrentProblem++;

    if (selectedOp === currentProblem.correctOp) {
      isTransitioning = true;
      optionButtons.forEach(btn => btn.disabled = true);
      clickedButton.classList.add('correct-choice');

      feedbackEl.innerHTML = `Correct! You <strong>${selectedOp.toLowerCase()}</strong> to undo the operation.`;
      feedbackEl.className = "feedback correct";

      if (attemptsOnCurrentProblem === 1) {
        total++;
        correct++;
        streak++;
      } else {
        streak++;
      }

      updateStats();

      setTimeout(() => {
        generateProblem();
      }, 1600);

    } else {
      clickedButton.classList.add('incorrect-choice');
      clickedButton.disabled = true;

      if (attemptsOnCurrentProblem === 1) {
        feedbackEl.innerHTML = currentProblem.hintText;
        feedbackEl.className = "feedback incorrect";

        total++;
        incorrect++;
        streak = 0;
        updateStats();
      } else {
        feedbackEl.innerHTML = `Incorrect. The inverse operation is <strong>${currentProblem.correctOp}</strong>.`;
        feedbackEl.className = "feedback incorrect";

        streak = 0;
        updateStats();
      }
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;

    // High Streak Milestone Visual Toggle (Streak >= 10)
    if (streak >= 10) {
      document.body.classList.add('high-streak');
    } else {
      document.body.classList.remove('high-streak');
    }
  }

  optionButtons.forEach(button => {
    button.addEventListener('click', function() {
      const op = this.getAttribute('data-op');
      handleOptionSelect(op, this);
    });
  });

  generateProblem();
</script>

</body>
</html>
