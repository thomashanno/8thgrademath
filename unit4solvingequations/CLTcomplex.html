<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combining Like Terms Practice (Integers)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .instruction {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #444;
      line-height: 1.4;
    }

    .problem-display {
      font-size: 26px;
      font-weight: bold;
      color: #111;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 16px 12px;
      margin: 15px 0 20px 0;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      font-size: 20px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }

    /* Input feedback states */
    input[type="text"].input-correct {
      border-color: #28a745 !important;
      background-color: #e8f8ec !important;
      color: #155724;
    }
    input[type="text"].input-incorrect {
      border-color: #dc3545 !important;
      background-color: #fdf2f2 !important;
      color: #721c24;
    }

    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }

    /* Keypad Layout: 4 Columns */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 20px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      min-height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.4;
      padding: 0 5px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Combining Like Terms</h2>
  <p class="instruction">Simplify the expression by combining like terms.</p>

  <div class="problem-display" id="problemDisplay">5x - 3 + 4x + 2</div>

  <form id="answerForm">
    <input type="text" id="userInput" placeholder="e.g. 5x² + 3x - 2 or 5x^2 + 3x - 2" autocomplete="off">
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      <button type="button" class="key-btn" data-val="x">x</button>

      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>
      <button type="button" class="key-btn" data-val="y">y</button>

      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>
      <button type="button" class="key-btn" data-val="x²">x²</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn" data-val="-">-</button>
      <button type="button" class="key-btn" data-val="0">0</button>
      <button type="button" class="key-btn" data-val="+">+</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit Answer</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="https://thomashanno.github.io/8thgrademath/index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentProblem = null;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  let attemptsOnCurrentProblem = 0;

  const userInput = document.getElementById('userInput');
  const problemDisplayEl = document.getElementById('problemDisplay');
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function getRandomNonZero(min, max) {
    let val = 0;
    while (val === 0) {
      val = getRandomInt(min, max);
    }
    return val;
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function resetInputStyle() {
    userInput.classList.remove('input-correct', 'input-incorrect');
  }

  // Format array of term objects into clean expression string
  function formatExpression(terms) {
    let str = "";
    terms.forEach((t, i) => {
      let c = t.coeff;
      if (c === 0) return;

      let absC = Math.abs(c);
      let label = "";
      if (t.type === 'x2') label = "x²";
      else if (t.type === 'x') label = "x";
      else if (t.type === 'y') label = "y";

      let termValStr = "";
      if (t.type === 'const') {
        termValStr = `${absC}`;
      } else {
        termValStr = (absC === 1) ? label : `${absC}${label}`;
      }

      if (i === 0) {
        str += (c < 0) ? `-${termValStr}` : `${termValStr}`;
      } else {
        str += (c < 0) ? ` - ${termValStr}` : ` + ${termValStr}`;
      }
    });
    return str;
  }

  function generateProblem() {
    // Problem types: 0 = Standard (2 x terms, 2 constants), 1 = Tricky x², 2 = Tricky y
    const rand = Math.random();
    let pType = 0;
    if (rand < 0.22) pType = 1;      // 22% x² tricky
    else if (rand < 0.38) pType = 2; // 16% y tricky

    let terms = [];
    let targetMap = { 'x²': 0, 'x': 0, 'y': 0, 'const': 0 };

    let a = getRandomNonZero(-9, 9);
    let c = getRandomNonZero(-9, 9);
    while (a + c === 0) c = getRandomNonZero(-9, 9);

    let b = getRandomNonZero(-12, 12);
    let d = getRandomNonZero(-12, 12);
    while (b + d === 0) d = getRandomNonZero(-12, 12);

    terms.push({ type: 'x', coeff: a });
    terms.push({ type: 'const', coeff: b });
    terms.push({ type: 'x', coeff: c });
    terms.push({ type: 'const', coeff: d });

    targetMap['x'] = a + c;
    targetMap['const'] = b + d;

    let hintMsg = "";

    if (pType === 1) {
      let k = getRandomNonZero(-5, 5);
      terms.push({ type: 'x2', coeff: k });
      targetMap['x²'] = k;

      const aStr = formatExpression([{ type: 'x', coeff: a }]);
      const xSumStr = formatExpression([{ type: 'x', coeff: a + c }]);
      const constSumStr = formatExpression([{ type: 'const', coeff: b + d }]);

      hintMsg = `💡 <strong>Hint:</strong> <strong>x²</strong> and <strong>x</strong> are NOT like terms! Combine x terms (${aStr} ${c < 0 ? '-' : '+'} ${Math.abs(c)}x = ${xSumStr}) and constants (${b} ${d < 0 ? '-' : '+'} ${Math.abs(d)} = ${constSumStr}).`;
    } else if (pType === 2) {
      let k = getRandomNonZero(-9, 9);
      terms.push({ type: 'y', coeff: k });
      targetMap['y'] = k;

      const aStr = formatExpression([{ type: 'x', coeff: a }]);
      const xSumStr = formatExpression([{ type: 'x', coeff: a + c }]);
      const constSumStr = formatExpression([{ type: 'const', coeff: b + d }]);

      hintMsg = `💡 <strong>Hint:</strong> <strong>x</strong> and <strong>y</strong> are NOT like terms! Combine x terms (${aStr} ${c < 0 ? '-' : '+'} ${Math.abs(c)}x = ${xSumStr}) and constants (${b} ${d < 0 ? '-' : '+'} ${Math.abs(d)} = ${constSumStr}).`;
    } else {
      const aStr = formatExpression([{ type: 'x', coeff: a }]);
      const xSumStr = formatExpression([{ type: 'x', coeff: a + c }]);
      const constSumStr = formatExpression([{ type: 'const', coeff: b + d }]);

      hintMsg = `💡 <strong>Hint:</strong> Combine x terms (${aStr} ${c < 0 ? '-' : '+'} ${Math.abs(c)}x = ${xSumStr}) and constant terms (${b} ${d < 0 ? '-' : '+'} ${Math.abs(d)} = ${constSumStr}).`;
    }

    shuffle(terms);
    const exprDisplayStr = formatExpression(terms);
    problemDisplayEl.textContent = exprDisplayStr;

    let standardTerms = [];
    if (targetMap['x²'] !== 0) standardTerms.push({ type: 'x2', coeff: targetMap['x²'] });
    if (targetMap['x'] !== 0) standardTerms.push({ type: 'x', coeff: targetMap['x'] });
    if (targetMap['y'] !== 0) standardTerms.push({ type: 'y', coeff: targetMap['y'] });
    if (targetMap['const'] !== 0) standardTerms.push({ type: 'const', coeff: targetMap['const'] });

    const expectedStandardStr = formatExpression(standardTerms);

    currentProblem = {
      targetMap: targetMap,
      expectedStandardStr: expectedStandardStr,
      hintText: hintMsg,
      explanation: `Correct! <strong>${exprDisplayStr}</strong> = <strong>${expectedStandardStr}</strong>`
    };

    attemptsOnCurrentProblem = 0;
    userInput.value = '';
    resetInputStyle();

    if (!isMobile) {
      userInput.focus();
    }
  }

  // Polynomial Parser: Seamlessly accepts x^2, x**, x², space formatting, and any term order
  function parsePolynomial(str) {
    if (!str) return null;
    let clean = str.replace(/\s+/g, '')
                   .toLowerCase()
                   .replace(/x\*\*2/g, 'x²')
                   .replace(/x\^2/g, 'x²');
                   
    if (!clean) return null;

    // Standardize subtraction as addition of negative term
    let normalized = clean.replace(/(.)-/g, '$1+-');
    let parts = normalized.split('+').filter(p => p.length > 0);

    let map = { 'x²': 0, 'x': 0, 'y': 0, 'const': 0 };

    for (let part of parts) {
      if (part.endsWith('x²')) {
        let c = part.slice(0, -2);
        if (c === '' || c === '+') map['x²'] += 1;
        else if (c === '-') map['x²'] -= 1;
        else {
          let val = parseInt(c, 10);
          if (isNaN(val)) return null;
          map['x²'] += val;
        }
      } else if (part.endsWith('x')) {
        let c = part.slice(0, -1);
        if (c === '' || c === '+') map['x'] += 1;
        else if (c === '-') map['x'] -= 1;
        else {
          let val = parseInt(c, 10);
          if (isNaN(val)) return null;
          map['x'] += val;
        }
      } else if (part.endsWith('y')) {
        let c = part.slice(0, -1);
        if (c === '' || c === '+') map['y'] += 1;
        else if (c === '-') map['y'] -= 1;
        else {
          let val = parseInt(c, 10);
          if (isNaN(val)) return null;
          map['y'] += val;
        }
      } else {
        let val = parseInt(part, 10);
        if (isNaN(val)) return null;
        map['const'] += val;
      }
    }
    return map;
  }

  function evaluateAnswer(userAnswer) {
    const feedback = document.getElementById('feedback');
    const userMap = parsePolynomial(userAnswer);

    let isCorrect = false;

    if (userMap !== null) {
      const t = currentProblem.targetMap;
      isCorrect = (userMap['x²'] === t['x²']) &&
                  (userMap['x'] === t['x']) &&
                  (userMap['y'] === t['y']) &&
                  (userMap['const'] === t['const']);
    }

    attemptsOnCurrentProblem++;

    if (isCorrect) {
      feedback.innerHTML = currentProblem.explanation;
      feedback.className = "feedback correct";
      
      userInput.classList.remove('input-incorrect');
      userInput.classList.add('input-correct');

      if (attemptsOnCurrentProblem === 1) {
        total++;
        correct++;
        streak++;
      } else {
        streak++;
      }
      
      updateStats();
      setTimeout(() => {
        feedback.innerHTML = "";
        generateProblem();
      }, 1600);
    } else {
      userInput.classList.remove('input-correct');
      userInput.classList.add('input-incorrect');

      if (attemptsOnCurrentProblem === 1) {
        feedback.innerHTML = currentProblem.hintText;
        feedback.className = "feedback incorrect";
        
        total++;
        incorrect++;
        streak = 0;
        updateStats();
      } else {
        feedback.innerHTML = `Incorrect. Combined simplified answer is <strong>${currentProblem.expectedStandardStr}</strong>`;
        feedback.className = "feedback incorrect";
        
        streak = 0;
        updateStats();
      }
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Insert text at current cursor / selection position
  function insertAtCursor(val) {
    resetInputStyle();
    
    let start = userInput.selectionStart;
    let end = userInput.selectionEnd;

    // Fallback if selection properties are null (e.g. initial focus)
    if (start === null || start === undefined) start = userInput.value.length;
    if (end === null || end === undefined) end = userInput.value.length;

    const currentText = userInput.value;
    userInput.value = currentText.slice(0, start) + val + currentText.slice(end);

    const newCursorPos = start + val.length;
    userInput.setSelectionRange(newCursorPos, newCursorPos);

    if (!isMobile) {
      userInput.focus();
    }
  }

  // Delete text at current cursor / selection position
  function backspaceAtCursor() {
    resetInputStyle();

    let start = userInput.selectionStart;
    let end = userInput.selectionEnd;

    if (start === null || start === undefined) start = userInput.value.length;
    if (end === null || end === undefined) end = userInput.value.length;

    const currentText = userInput.value;

    if (start !== end) {
      // Highlighted selection exists
      userInput.value = currentText.slice(0, start) + currentText.slice(end);
      userInput.setSelectionRange(start, start);
    } else if (start > 0) {
      // Backspace character before cursor
      userInput.value = currentText.slice(0, start - 1) + currentText.slice(start);
      userInput.setSelectionRange(start - 1, start - 1);
    }

    if (!isMobile) {
      userInput.focus();
    }
  }

  // Keypad Event Handlers
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      const val = this.getAttribute('data-val');
      insertAtCursor(val);
    });
  });

  document.getElementById('backspaceBtn').addEventListener('click', function() {
    backspaceAtCursor();
  });

  userInput.addEventListener('input', resetInputStyle);

  // Submit Logic
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (userInput.value.trim() === '') return;
    evaluateAnswer(userInput.value);
  });

  generateProblem();
</script>

</body>
</html>
