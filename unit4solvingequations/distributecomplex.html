<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Distributive Property Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .instruction {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #444;
      line-height: 1.4;
    }

    .problem-display {
      font-size: 26px;
      font-weight: bold;
      color: #111;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 18px 12px;
      margin: 15px 0 20px 0;
      letter-spacing: 0.5px;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    /* Vinculum Fraction Styling for Outer Factor */
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      align-items: center;
      line-height: 1.1;
      font-size: 22px;
      margin: 0 2px;
    }
    .numerator {
      border-bottom: 2.5px solid #111;
      padding: 0 4px 2px 4px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .denominator {
      padding: 2px 4px 0 4px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    input[type="text"] {
      font-size: 20px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }

    /* Input feedback states */
    input[type="text"].input-correct {
      border-color: #28a745 !important;
      background-color: #e8f8ec !important;
      color: #155724;
    }
    input[type="text"].input-incorrect {
      border-color: #dc3545 !important;
      background-color: #fdf2f2 !important;
      color: #721c24;
    }

    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }

    /* Keypad Layout: 4 Columns */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 20px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.4;
      padding: 0 5px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Advanced Distributive Property</h2>
  <p class="instruction">Distribute the outer decimal or fraction across all terms inside.</p>

  <div class="problem-display" id="problemDisplay"></div>

  <form id="answerForm">
    <input type="text" id="userInput" placeholder="e.g. 2x² - 3x + 1.5" autocomplete="off">
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      <button type="button" class="key-btn" data-val="x">x</button>

      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>
      <button type="button" class="key-btn" data-val="x²">x²</button>

      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>
      <button type="button" class="key-btn" data-val="+">+</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn" data-val="-">-</button>
      <button type="button" class="key-btn" data-val="0">0</button>
      <button type="button" class="key-btn" data-val=".">.</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit Answer</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="https://thomashanno.github.io/8thgrademath/index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentProblem = null;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  let attemptsOnCurrentProblem = 0;

  const userInput = document.getElementById('userInput');
  const problemDisplayEl = document.getElementById('problemDisplay');
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function getRandomNonZero(min, max) {
    let val = 0;
    while (val === 0) {
      val = getRandomInt(min, max);
    }
    return val;
  }

  function resetInputStyle() {
    userInput.classList.remove('input-correct', 'input-incorrect');
  }

  // Pre-defined Outer Factor options (Decimals and Fractions, positive & negative)
  const outerOptions = [
    // Fractions
    { type: 'frac', num: 1, den: 2, val: 0.5, str: '1/2' },
    { type: 'frac', num: -1, den: 2, val: -0.5, str: '-1/2' },
    { type: 'frac', num: 1, den: 3, val: 1/3, str: '1/3' },
    { type: 'frac', num: -1, den: 3, val: -1/3, str: '-1/3' },
    { type: 'frac', num: 1, den: 4, val: 0.25, str: '1/4' },
    { type: 'frac', num: -1, den: 4, val: -0.25, str: '-1/4' },
    { type: 'frac', num: 3, den: 4, val: 0.75, str: '3/4' },
    { type: 'frac', num: -3, den: 4, val: -0.75, str: '-3/4' },
    { type: 'frac', num: 2, den: 3, val: 2/3, str: '2/3' },
    { type: 'frac', num: -2, den: 3, val: -2/3, str: '-2/3' },
    
    // Decimals
    { type: 'dec', val: 0.5, str: '0.5' },
    { type: 'dec', val: -0.5, str: '-0.5' },
    { type: 'dec', val: 0.25, str: '0.25' },
    { type: 'dec', val: -0.25, str: '-0.25' },
    { type: 'dec', val: 0.2, str: '0.2' },
    { type: 'dec', val: -0.2, str: '-0.2' },
    { type: 'dec', val: 1.5, str: '1.5' },
    { type: 'dec', val: -1.5, str: '-1.5' },
    { type: 'dec', val: 0.4, str: '0.4' },
    { type: 'dec', val: -0.4, str: '-0.4' }
  ];

  function formatTermsArray(terms) {
    let str = "";
    terms.forEach((t, i) => {
      let c = t.coeff;
      if (Math.abs(c) < 0.0001) return;

      let absC = Math.abs(c);
      // Clean decimal display (e.g., 1.5 instead of 1.50000000)
      let absCStr = (Math.round(absC * 100) / 100).toString();

      let label = t.type === 'x2' ? 'x²' : (t.type === 'x' ? 'x' : '');

      let termValStr = "";
      if (t.type === 'const') {
        termValStr = `${absCStr}`;
      } else {
        termValStr = (absC === 1) ? label : `${absCStr}${label}`;
      }

      if (i === 0) {
        str += (c < 0) ? `-${termValStr}` : `${termValStr}`;
      } else {
        str += (c < 0) ? ` - ${termValStr}` : ` + ${termValStr}`;
      }
    });
    return str || "0";
  }

  function generateProblem() {
    // Pick random outer factor
    const outer = outerOptions[getRandomInt(0, outerOptions.length - 1)];

    // Decide number of terms inside: 0 = 3 terms (x², x, const), 1 = 2 terms (x², const), 2 = 2 terms (x, const)
    const pattern = getRandomInt(0, 2);

    // Multipliers for inside terms to ensure products stay clean and products < 50
    let stepUnit = 1;
    if (outer.type === 'frac') stepUnit = outer.den;
    else if (outer.val === 0.25 || outer.val === -0.25 || outer.val === 1.5 || outer.val === -1.5) stepUnit = 2;
    else if (outer.val === 0.2 || outer.val === -0.2 || outer.val === 0.4 || outer.val === -0.4) stepUnit = 5;

    let maxUnits = Math.floor(49 / Math.abs(outer.val * stepUnit));
    if (maxUnits < 1) maxUnits = 1;
    maxUnits = Math.min(maxUnits, 6);

    let insideTerms = [];
    let targetMap = { 'x²': 0, 'x': 0, 'const': 0 };

    if (pattern === 0) {
      // 3 Terms: ax² + bx + c
      let aUnits = getRandomNonZero(-maxUnits, maxUnits);
      let bUnits = getRandomNonZero(-maxUnits, maxUnits);
      let cUnits = getRandomNonZero(-maxUnits, maxUnits);

      let a = aUnits * stepUnit;
      let b = bUnits * stepUnit;
      let c = cUnits * stepUnit;

      insideTerms.push({ type: 'x2', coeff: a });
      insideTerms.push({ type: 'x', coeff: b });
      insideTerms.push({ type: 'const', coeff: c });

      targetMap['x²'] = Math.round(outer.val * a * 100) / 100;
      targetMap['x'] = Math.round(outer.val * b * 100) / 100;
      targetMap['const'] = Math.round(outer.val * c * 100) / 100;

    } else if (pattern === 1) {
      // 2 Terms: ax² + c
      let aUnits = getRandomNonZero(-maxUnits, maxUnits);
      let cUnits = getRandomNonZero(-maxUnits, maxUnits);

      let a = aUnits * stepUnit;
      let c = cUnits * stepUnit;

      insideTerms.push({ type: 'x2', coeff: a });
      insideTerms.push({ type: 'const', coeff: c });

      targetMap['x²'] = Math.round(outer.val * a * 100) / 100;
      targetMap['const'] = Math.round(outer.val * c * 100) / 100;

    } else {
      // 2 Terms: bx + c
      let bUnits = getRandomNonZero(-maxUnits, maxUnits);
      let cUnits = getRandomNonZero(-maxUnits, maxUnits);

      let b = bUnits * stepUnit;
      let c = cUnits * stepUnit;

      insideTerms.push({ type: 'x', coeff: b });
      insideTerms.push({ type: 'const', coeff: c });

      targetMap['x'] = Math.round(outer.val * b * 100) / 100;
      targetMap['const'] = Math.round(outer.val * c * 100) / 100;
    }

    const insideExprStr = formatTermsArray(insideTerms);

    // Build display HTML
    let displayHTML = "";
    if (outer.type === 'frac') {
      let isNeg = outer.num < 0;
      let absNum = Math.abs(outer.num);
      let negSign = isNeg ? "<span>-</span>" : "";
      displayHTML = `${negSign}<div class="fraction"><span class="numerator">${absNum}</span><span class="denominator">${outer.den}</span></div><span>(${insideExprStr})</span>`;
    } else {
      displayHTML = `<span>${outer.str}(${insideExprStr})</span>`;
    }

    problemDisplayEl.innerHTML = displayHTML;

    // Standard Expected Output String
    let targetTerms = [];
    if (targetMap['x²'] !== 0) targetTerms.push({ type: 'x2', coeff: targetMap['x²'] });
    if (targetMap['x'] !== 0) targetTerms.push({ type: 'x', coeff: targetMap['x'] });
    if (targetMap['const'] !== 0) targetTerms.push({ type: 'const', coeff: targetMap['const'] });

    const expectedStandardStr = formatTermsArray(targetTerms);

    // Hint text detailing each term multiplication
    let hintSteps = insideTerms.map(t => {
      let termLabel = formatTermsArray([t]);
      let resVal = Math.round(outer.val * t.coeff * 100) / 100;
      let resTerm = formatTermsArray([{ type: t.type, coeff: resVal }]);
      return `• ${outer.str} × (${termLabel}) = <strong>${resTerm}</strong>`;
    }).join('<br>');

    const hintMsg = `💡 <strong>Hint:</strong> Multiply <strong>${outer.str}</strong> by each term inside:<br>${hintSteps}`;

    currentProblem = {
      targetMap: targetMap,
      expectedStandardStr: expectedStandardStr,
      hintText: hintMsg,
      explanation: `Correct! Simplified expression is <strong>${expectedStandardStr}</strong>`
    };

    attemptsOnCurrentProblem = 0;
    userInput.value = '';
    resetInputStyle();

    if (!isMobile) {
      userInput.focus();
    }
  }

  // Flexible Polynomial Parser (accepts any term order, decimals, +/- spacing, implicit coefficients)
  function parsePolynomial(str) {
    if (!str) return null;
    let clean = str.replace(/\s+/g, '')
                   .toLowerCase()
                   .replace(/x\*\*2/g, 'x²')
                   .replace(/x\^2/g, 'x²');
                   
    if (!clean) return null;

    // Standardize subtraction as addition of negative term
    let normalized = clean.replace(/(.)-/g, '$1+-');
    let parts = normalized.split('+').filter(p => p.length > 0);

    let map = { 'x²': 0, 'x': 0, 'const': 0 };

    for (let part of parts) {
      if (part.endsWith('x²')) {
        let c = part.slice(0, -2);
        if (c === '' || c === '+') map['x²'] += 1;
        else if (c === '-') map['x²'] -= 1;
        else {
          let val = parseFloat(c);
          if (isNaN(val)) return null;
          map['x²'] += val;
        }
      } else if (part.endsWith('x')) {
        let c = part.slice(0, -1);
        if (c === '' || c === '+') map['x'] += 1;
        else if (c === '-') map['x'] -= 1;
        else {
          let val = parseFloat(c);
          if (isNaN(val)) return null;
          map['x'] += val;
        }
      } else {
        let val = parseFloat(part);
        if (isNaN(val)) return null;
        map['const'] += val;
      }
    }

    // Round parsed terms to 2 decimal places to avoid floating point precision issues
    map['x²'] = Math.round(map['x²'] * 100) / 100;
    map['x'] = Math.round(map['x'] * 100) / 100;
    map['const'] = Math.round(map['const'] * 100) / 100;

    return map;
  }

  function evaluateAnswer(userAnswer) {
    const feedback = document.getElementById('feedback');
    const userMap = parsePolynomial(userAnswer);

    let isCorrect = false;

    if (userMap !== null) {
      const t = currentProblem.targetMap;
      isCorrect = (Math.abs(userMap['x²'] - t['x²']) < 0.01) &&
                  (Math.abs(userMap['x'] - t['x']) < 0.01) &&
                  (Math.abs(userMap['const'] - t['const']) < 0.01);
    }

    attemptsOnCurrentProblem++;

    if (isCorrect) {
      feedback.innerHTML = currentProblem.explanation;
      feedback.className = "feedback correct";
      
      userInput.classList.remove('input-incorrect');
      userInput.classList.add('input-correct');

      if (attemptsOnCurrentProblem === 1) {
        total++;
        correct++;
        streak++;
      } else {
        streak++;
      }
      
      updateStats();
      setTimeout(() => {
        feedback.innerHTML = "";
        generateProblem();
      }, 1600);
    } else {
      userInput.classList.remove('input-correct');
      userInput.classList.add('input-incorrect');

      if (attemptsOnCurrentProblem === 1) {
        feedback.innerHTML = currentProblem.hintText;
        feedback.className = "feedback incorrect";
        
        total++;
        incorrect++;
        streak = 0;
        updateStats();
      } else {
        feedback.innerHTML = `Incorrect. Distributed expression is <strong>${currentProblem.expectedStandardStr}</strong>`;
        feedback.className = "feedback incorrect";
        
        streak = 0;
        updateStats();
      }
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Insert text at current cursor / selection position
  function insertAtCursor(val) {
    resetInputStyle();
    
    let start = userInput.selectionStart;
    let end = userInput.selectionEnd;

    if (start === null || start === undefined) start = userInput.value.length;
    if (end === null || end === undefined) end = userInput.value.length;

    const currentText = userInput.value;
    userInput.value = currentText.slice(0, start) + val + currentText.slice(end);

    const newCursorPos = start + val.length;
    userInput.setSelectionRange(newCursorPos, newCursorPos);

    if (!isMobile) {
      userInput.focus();
    }
  }

  // Delete text at current cursor / selection position
  function backspaceAtCursor() {
    resetInputStyle();

    let start = userInput.selectionStart;
    let end = userInput.selectionEnd;

    if (start === null || start === undefined) start = userInput.value.length;
    if (end === null || end === undefined) end = userInput.value.length;

    const currentText = userInput.value;

    if (start !== end) {
      userInput.value = currentText.slice(0, start) + currentText.slice(end);
      userInput.setSelectionRange(start, start);
    } else if (start > 0) {
      userInput.value = currentText.slice(0, start - 1) + currentText.slice(start);
      userInput.setSelectionRange(start - 1, start - 1);
    }

    if (!isMobile) {
      userInput.focus();
    }
  }

  // Keypad Event Handlers
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      const val = this.getAttribute('data-val');
      insertAtCursor(val);
    });
  });

  document.getElementById('backspaceBtn').addEventListener('click', function() {
    backspaceAtCursor();
  });

  userInput.addEventListener('input', resetInputStyle);

  // Submit Logic
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (userInput.value.trim() === '') return;
    evaluateAnswer(userInput.value);
  });

  generateProblem();
</script>

</body>
</html>
