<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixed Exponent Operations Practice (with integers)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .problem {
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0 10px 0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60px;
    }
    
    /* Vinculum Fraction Styling */
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
    }
    .numerator {
      border-bottom: 2px solid #333;
      padding-bottom: 2px;
    }
    .denominator {
      padding-top: 2px;
    }

    /* Live Formatted Math Display */
    .math-preview {
      font-size: 28px;
      font-weight: bold;
      color: #007bff;
      min-height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      background: #f8f9fa;
      border: 2px dashed #007bff;
      border-radius: 6px;
      padding: 4px 10px;
      box-sizing: border-box;
    }
    .math-preview sup {
      font-size: 0.65em;
      vertical-align: super;
      line-height: 0;
    }
    .preview-placeholder {
      font-size: 14px;
      color: #aaa;
      font-weight: normal;
    }

    input[type="text"] {
      font-size: 18px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }
    
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      height: 24px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Mixed Exponent Operations</h2>
  <p style="margin: 0 0 10px 0; font-size: 14px; color: #666;">Use keypad or keyboard to enter answer</p>
  
  <div class="problem" id="problem">x^-3 • x^5</div>
  
  <!-- Live Math Formatting Display -->
  <div class="math-preview" id="mathPreview">
    <span class="preview-placeholder">Your answer preview</span>
  </div>

  <form id="answerForm">
    <input type="text" id="userInput" placeholder="e.g. x^2" autocomplete="off" required>
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      <button type="button" class="key-btn action" data-val="x">x</button>
      
      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>
      <button type="button" class="key-btn action" data-val="^">^</button>
      
      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>
      <button type="button" class="key-btn action" data-val="-">-</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn" data-val="0" style="grid-column: span 3;">0</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="../index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentAnswer = "";
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;

  const userInput = document.getElementById('userInput');
  const mathPreview = document.getElementById('mathPreview');

  // Detect mobile device to disable virtual keyboard popups on phones/tablets
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Renders typed/tapped x^9 as x⁹ visually in the preview box
  function updateMathPreview() {
    const val = userInput.value.trim();
    if (!val) {
      mathPreview.innerHTML = '<span class="preview-placeholder">Your answer preview</span>';
      return;
    }

    if (val.includes('^')) {
      const parts = val.split('^');
      const base = parts[0] || '';
      const exp = parts[1] !== undefined ? parts[1] : '';
      mathPreview.innerHTML = `${escapeHtml(base)}<sup>${escapeHtml(exp)}</sup>`;
    } else {
      mathPreview.innerHTML = escapeHtml(val);
    }
  }

  // Normalizes unicode superscripts (if pasted or typed) back into x^9 format
  function cleanAnswer(text) {
    const revMap = {
      '⁰':'0', '¹':'1', '²':'2', '³':'3', '⁴':'4',
      '⁵':'5', '⁶':'6', '⁷':'7', '⁸':'8', '⁹':'9', '⁻':'-'
    };
    let normalized = '';
    let inExp = false;
    for (let char of text) {
      if (revMap[char]) {
        if (!inExp) {
          normalized += '^';
          inExp = true;
        }
        normalized += revMap[char];
      } else {
        if (char !== '^') inExp = false;
        normalized += char;
      }
    }
    return normalized.trim().toLowerCase().replace(/\s+/g, '');
  }

  // Generates non-zero integers between min and max
  function getRandomNonZeroInt(min, max) {
    let num = 0;
    while (num === 0) {
      num = Math.floor(Math.random() * (max - min + 1)) + min;
    }
    return num;
  }

  function generateProblem() {
    const types = ['multiply', 'divide', 'power'];
    const type = types[Math.floor(Math.random() * types.length)];
    const variable = 'x';
    
    // Generates positive or negative integer exponents between -9 and 9
    let p1 = getRandomNonZeroInt(-9, 9);
    let p2 = getRandomNonZeroInt(-9, 9);
    let problemText = "";

    if (type === 'multiply') {
      problemText = `${variable}<sup>${p1}</sup> • ${variable}<sup>${p2}</sup>`;
      currentAnswer = `${variable}^${p1 + p2}`;
    } else if (type === 'divide') {
      // Formatted with a vinculum fraction line
      problemText = `<div class="fraction">
        <span class="numerator">${variable}<sup>${p1}</sup></span>
        <span class="denominator">${variable}<sup>${p2}</sup></span>
      </div>`;
      currentAnswer = `${variable}^${p1 - p2}`;
    } else if (type === 'power') {
      problemText = `(${variable}<sup>${p1}</sup>)<sup>${p2}</sup>`;
      currentAnswer = `${variable}^${p1 * p2}`;
    }

    document.getElementById('problem').innerHTML = problemText;
    userInput.value = '';
    updateMathPreview();
    
    if (!isMobile) {
      userInput.focus();
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Handle typing input from physical keyboards
  userInput.addEventListener('input', function() {
    updateMathPreview();
  });

  // Handle Keypad Buttons
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      userInput.value += this.getAttribute('data-val');
      updateMathPreview();
      if (!isMobile) userInput.focus();
    });
  });

  // Handle Backspace Button
  document.getElementById('backspaceBtn').addEventListener('click', function() {
    userInput.value = userInput.value.slice(0, -1);
    updateMathPreview();
    if (!isMobile) userInput.focus();
  });

  // Handle Answer Validation
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const userSubmission = cleanAnswer(userInput.value);
    const feedback = document.getElementById('feedback');

    total++;

    if (userSubmission === currentAnswer) {
      feedback.textContent = "Correct!";
      feedback.className = "feedback correct";
      streak++;
      correct++;
      updateStats();
      setTimeout(() => {
        feedback.textContent = "";
        generateProblem();
      }, 1000);
    } else {
      feedback.textContent = `Try again! (Answer: ${currentAnswer})`;
      feedback.className = "feedback incorrect";
      streak = 0;
      incorrect++;
      updateStats();
    }
  });

  generateProblem();
</script>

</body>
</html>
