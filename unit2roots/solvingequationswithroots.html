<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solving Equations with Squares & Roots</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .problem {
      font-size: 38px;
      font-weight: bold;
      margin: 15px 0 10px 0;
      color: #333;
      min-height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .instruction {
      margin: 0 0 15px 0;
      font-size: 14px;
      color: #666;
    }

    input[type="text"] {
      font-size: 22px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }

    /* Input feedback states */
    input[type="text"].input-correct {
      border-color: #28a745 !important;
      background-color: #e8f8ec !important;
      color: #155724;
    }
    input[type="text"].input-incorrect {
      border-color: #dc3545 !important;
      background-color: #fdf2f2 !important;
      color: #721c24;
    }

    .no-solution-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .no-solution-btn:hover {
      background-color: #5a6268;
    }

    .submit-btn {
      margin-top: 8px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }

    /* Keypad Layout */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 22px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      min-height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.3;
      padding: 0 5px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Solving Equations with Roots & Powers</h2>
  <p class="instruction">Solve for <strong>x</strong> (or select No Real Solution)</p>

  <div class="problem" id="problem">x² = 25</div>
  
  <form id="answerForm">
    <input type="text" id="userInput" placeholder="Type answer for x..." autocomplete="off">
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>

      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>

      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn action" data-val="pm">±</button>
      <button type="button" class="key-btn" data-val="0">0</button>
      <button type="button" class="key-btn" data-val="-">-</button>

      <!-- Row 5 -->
      <button type="button" class="key-btn action" id="backspaceBtn" style="grid-column: span 3;">⌫ Backspace</button>
    </div>

    <!-- No Real Solution positioned ABOVE Submit Answer -->
    <button type="button" id="noSolBtn" class="no-solution-btn">🚫 No Real Solution</button>
    <button type="submit" id="submitBtn" class="submit-btn">Submit Answer</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="https://thomashanno.github.io/8thgrademath/index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentProblem = null;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  let hasAttemptedCurrentProblem = false;

  const userInput = document.getElementById('userInput');
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function resetInputStyle() {
    userInput.classList.remove('input-correct', 'input-incorrect');
  }

  function generateProblem() {
    const problemType = getRandomInt(1, 8);
    let problemHtml = "";
    let expectedAnswer = "";
    let requiresPlusMinus = false;
    let isNoSolution = false;
    let explanation = "";

    switch(problemType) {
      case 1: { // x² = positive square (Requires ±)
        const root = getRandomInt(1, 10);
        const sq = root * root;
        problemHtml = `x² = ${sq}`;
        expectedAnswer = `±${root}`;
        requiresPlusMinus = true;
        explanation = `Correct! x = ±${root} because (${root})² = ${sq} AND (-${root})² = ${sq}.`;
        break;
      }
      case 2: { // x² = negative number (NO REAL SOLUTION)
        const negVal = -getRandomInt(4, 100);
        problemHtml = `x² = ${negVal}`;
        isNoSolution = true;
        explanation = `Correct! No real number squared can equal a negative number.`;
        break;
      }
      case 3: { // x³ = positive or negative cube
        const base = getRandomInt(-5, 5);
        if (base === 0) {
          problemHtml = `x³ = 0`;
          expectedAnswer = "0";
          explanation = `Correct! 0³ = 0.`;
        } else {
          const cb = base * base * base;
          problemHtml = `x³ = ${cb}`;
          expectedAnswer = base.toString();
          explanation = `Correct! (${base})³ = ${cb}.`;
        }
        break;
      }
      case 4: { // √x = positive integer
        const ans = getRandomInt(1, 10);
        problemHtml = `√x = ${ans}`;
        expectedAnswer = (ans * ans).toString();
        explanation = `Correct! √${ans * ans} = ${ans}.`;
        break;
      }
      case 5: { // √x = negative integer (NO REAL SOLUTION)
        const negAns = -getRandomInt(1, 9);
        problemHtml = `√x = ${negAns}`;
        isNoSolution = true;
        explanation = `Correct! Principal square root √x is never negative.`;
        break;
      }
      case 6: { // ∛x = integer
        const rootVal = getRandomInt(-4, 5);
        const cubedVal = rootVal * rootVal * rootVal;
        problemHtml = `∛x = ${rootVal}`;
        expectedAnswer = cubedVal.toString();
        explanation = `Correct! ∛${cubedVal} = ${rootVal}.`;
        break;
      }
      case 7: { // √square = x (Principal square root -> single positive value)
        const val = getRandomInt(1, 10);
        const sq = val * val;
        problemHtml = `√${sq} = x`;
        expectedAnswer = val.toString();
        explanation = `Correct! √${sq} = ${val} (principal root is always non-negative).`;
        break;
      }
      case 8: { // ∛cube = x
        const val = getRandomInt(-5, 5);
        const cb = val * val * val;
        problemHtml = `∛${cb} = x`;
        expectedAnswer = val.toString();
        explanation = `Correct! ∛${cb} = ${val}.`;
        break;
      }
    }

    currentProblem = {
      html: problemHtml,
      expectedAnswer: expectedAnswer,
      requiresPlusMinus: requiresPlusMinus,
      isNoSolution: isNoSolution,
      explanation: explanation
    };

    document.getElementById('problem').innerHTML = currentProblem.html;
    hasAttemptedCurrentProblem = false;
    userInput.value = '';
    resetInputStyle();

    if (!isMobile) {
      userInput.focus();
    }
  }

  function evaluateAnswer(userAnswer, userClickedNoSolution) {
    const feedback = document.getElementById('feedback');
    const cleanUser = userAnswer.trim().replace(/\s+/g, '');
    let isCorrect = false;

    if (currentProblem.isNoSolution) {
      isCorrect = userClickedNoSolution;
    } else {
      if (!userClickedNoSolution && cleanUser === currentProblem.expectedAnswer) {
        isCorrect = true;
      }
    }

    if (isCorrect) {
      feedback.innerHTML = currentProblem.explanation;
      feedback.className = "feedback correct";
      
      if (!userClickedNoSolution) {
        userInput.classList.remove('input-incorrect');
        userInput.classList.add('input-correct');
      }

      if (!hasAttemptedCurrentProblem) {
        total++;
        correct++;
        streak++;
      } else {
        streak++;
      }
      
      updateStats();
      setTimeout(() => {
        feedback.innerHTML = "";
        generateProblem();
      }, 1500);
    } else {
      let failMessage = "";

      if (currentProblem.isNoSolution) {
        failMessage = "Try again! This equation has <strong>No Real Solution</strong>.";
      } else if (currentProblem.requiresPlusMinus && (cleanUser === currentProblem.expectedAnswer.replace('±', '') || cleanUser === '-' + currentProblem.expectedAnswer.replace('±', ''))) {
        failMessage = `Don't forget both roots! Use the <strong>±</strong> button for x² equations (Answer: <strong>${currentProblem.expectedAnswer}</strong>).`;
      } else {
        failMessage = `Try again! Correct answer is x = <strong>${currentProblem.expectedAnswer}</strong>`;
      }

      feedback.innerHTML = failMessage;
      feedback.className = "feedback incorrect";
      
      if (!userClickedNoSolution) {
        userInput.classList.remove('input-correct');
        userInput.classList.add('input-incorrect');
      }

      if (!hasAttemptedCurrentProblem) {
        total++;
        incorrect++;
        hasAttemptedCurrentProblem = true;
      }

      streak = 0;
      updateStats();
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Keypad Event Handlers
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      resetInputStyle();
      const val = this.getAttribute('data-val');
      
      if (val === 'pm') { // Plus-Minus toggle logic
        if (userInput.value.startsWith('±')) {
          userInput.value = userInput.value.slice(1);
        } else {
          if (userInput.value.startsWith('-')) {
            userInput.value = '±' + userInput.value.slice(1);
          } else {
            userInput.value = '±' + userInput.value;
          }
        }
        return;
      }

      if (val === '-') { // Single negative toggle logic
        if (userInput.value.startsWith('±')) {
          userInput.value = '-' + userInput.value.slice(1);
        } else if (userInput.value.startsWith('-')) {
          userInput.value = userInput.value.slice(1);
        } else {
          userInput.value = '-' + userInput.value;
        }
        return;
      }
      
      userInput.value += val;
      if (!isMobile) userInput.focus();
    });
  });

  document.getElementById('backspaceBtn').addEventListener('click', function() {
    resetInputStyle();
    userInput.value = userInput.value.slice(0, -1);
    if (!isMobile) userInput.focus();
  });

  userInput.addEventListener('input', resetInputStyle);

  // Submit Logic
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (userInput.value.trim() === '') return;
    evaluateAnswer(userInput.value, false);
  });

  document.getElementById('noSolBtn').addEventListener('click', function() {
    evaluateAnswer('', true);
  });

  generateProblem();
</script>

</body>
</html>
