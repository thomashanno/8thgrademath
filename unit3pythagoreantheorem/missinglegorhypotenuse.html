<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pythagorean Theorem Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .instruction {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #666;
    }

    /* Dynamic Triangle Canvas Container */
    .canvas-container {
      margin: 10px 0 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background-color: #ffffff;
      border-radius: 8px;
    }

    input[type="text"] {
      font-size: 22px;
      padding: 10px;
      width: 100%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }

    /* Input feedback states */
    input[type="text"].input-correct {
      border-color: #28a745 !important;
      background-color: #e8f8ec !important;
      color: #155724;
    }
    input[type="text"].input-incorrect {
      border-color: #dc3545 !important;
      background-color: #fdf2f2 !important;
      color: #721c24;
    }

    .submit-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }

    /* Keypad Layout */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .key-btn {
      padding: 12px 0;
      font-size: 22px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #333;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active {
      background-color: #adb5bd;
    }
    .key-btn.action {
      background-color: #6c757d;
      color: white;
      border-color: #5a6268;
    }
    .key-btn.action:active {
      background-color: #495057;
    }

    .feedback {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      min-height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.4;
      padding: 0 5px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    
    .stats-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      color: #555;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .nav-links {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #eee;
      font-size: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .nav-links a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .nav-links span {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Pythagorean Theorem Practice</h2>
  <p class="instruction">Find the missing side <strong>x</strong>. Round to the nearest tenth if necessary.</p>

  <div class="canvas-container">
    <canvas id="triangleCanvas" width="280" height="180"></canvas>
  </div>
  
  <form id="answerForm">
    <input type="text" id="userInput" placeholder="Type answer for x..." autocomplete="off">
    
    <div class="keypad">
      <!-- Row 1 -->
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>

      <!-- Row 2 -->
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" class="key-btn" data-val="6">6</button>

      <!-- Row 3 -->
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>

      <!-- Row 4 -->
      <button type="button" class="key-btn" data-val=".">.</button>
      <button type="button" class="key-btn" data-val="0">0</button>
      <button type="button" class="key-btn action" id="backspaceBtn">⌫</button>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit Answer</button>
  </form>

  <div class="feedback" id="feedback"></div>

  <div class="stats-container">
    <div class="stat-item">
      <span>Streak</span>
      <span class="stat-value" id="streakVal">0</span>
    </div>
    <div class="stat-item">
      <span>Total</span>
      <span class="stat-value" id="totalVal">0</span>
    </div>
    <div class="stat-item">
      <span>Correct</span>
      <span class="stat-value" id="correctVal" style="color: #28a745;">0</span>
    </div>
    <div class="stat-item">
      <span>Incorrect</span>
      <span class="stat-value" id="incorrectVal" style="color: #dc3545;">0</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="javascript:history.back()">← Go Back</a>
    <span>|</span>
    <a href="https://thomashanno.github.io/8thgrademath/index.html">🏠 Home</a>
  </div>
</div>

<script>
  let currentProblem = null;
  let streak = 0;
  let total = 0;
  let correct = 0;
  let incorrect = 0;
  let attemptsOnCurrentProblem = 0;

  const userInput = document.getElementById('userInput');
  const canvas = document.getElementById('triangleCanvas');
  const ctx = canvas.getContext('2d');
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (isMobile) {
    userInput.setAttribute('readonly', 'true');
    userInput.setAttribute('inputmode', 'none');
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function resetInputStyle() {
    userInput.classList.remove('input-correct', 'input-incorrect');
  }

  // Draw Right Triangle with proper labels on canvas
  function drawTriangle(aLabel, bLabel, cLabel) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const x0 = 40;  
    const y0 = 145;
    const legAWidth = 170;  
    const legBHeight = 110; 

    const x1 = x0 + legAWidth; 
    const y1 = y0;
    const x2 = x0;             
    const y2 = y0 - legBHeight;

    // Draw Right Angle Box
    const boxSize = 14;
    ctx.beginPath();
    ctx.moveTo(x0, y0 - boxSize);
    ctx.lineTo(x0 + boxSize, y0 - boxSize);
    ctx.lineTo(x0 + boxSize, y0);
    ctx.strokeStyle = '#007bff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw Triangle Lines
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Text Styling
    ctx.font = 'bold 18px Arial';

    // Horizontal Leg (Bottom)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = (aLabel === 'x') ? '#d9534f' : '#111';
    ctx.fillText(aLabel, x0 + legAWidth / 2, y0 + 8);

    // Vertical Leg (Left)
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = (bLabel === 'x') ? '#d9534f' : '#111';
    ctx.fillText(bLabel, x0 - 10, y0 - legBHeight / 2);

    // Hypotenuse (Diagonal)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = (cLabel === 'x') ? '#d9534f' : '#111';
    ctx.fillText(cLabel, x0 + legAWidth / 2 + 12, y0 - legBHeight / 2 - 4);
  }

  function generateProblem() {
    const missingType = getRandomInt(1, 3); // 1 = missing leg a, 2 = missing leg b, 3 = missing hypotenuse c
    let a, b, c;
    let expectedVal = 0;
    let aText = "", bText = "", cText = "";
    let hintText = "";
    let explanation = "";

    const isPerfectTriple = Math.random() < 0.5;

    if (isPerfectTriple) {
      const triples = [
        [3, 4, 5], [5, 12, 13], [6, 8, 10], [7, 24, 25],
        [8, 15, 17], [9, 12, 15], [10, 24, 26], [12, 16, 20]
      ];
      const selected = triples[getRandomInt(0, triples.length - 1)];
      a = selected[0];
      b = selected[1];
      c = selected[2];
    } else {
      a = getRandomInt(3, 12);
      b = getRandomInt(3, 12);
      c = Math.sqrt(a * a + b * b);
    }

    if (missingType === 3) { // Find Hypotenuse (c)
      const cCalc = Math.sqrt(a * a + b * b);
      expectedVal = Math.round(cCalc * 10) / 10;
      aText = a.toString();
      bText = b.toString();
      cText = "x";
      hintText = `💡 <strong>Hint:</strong> Set up: <strong>${a}² + ${b}² = x²</strong>`;
      explanation = `Correct! <strong>${a}² + ${b}² = ${expectedVal}²</strong>`;
    } else if (missingType === 1) { // Find Leg a
      c = isPerfectTriple ? c : Math.max(a, b) + getRandomInt(2, 6);
      a = Math.sqrt(c * c - b * b);
      expectedVal = Math.round(a * 10) / 10;
      aText = "x";
      bText = b.toString();
      cText = c.toString();
      hintText = `💡 <strong>Hint:</strong> Set up: <strong>x² + ${b}² = ${c}²</strong>`;
      explanation = `Correct! <strong>${expectedVal}² + ${b}² = ${c}²</strong>`;
    } else { // Find Leg b
      c = isPerfectTriple ? c : Math.max(a, b) + getRandomInt(2, 6);
      b = Math.sqrt(c * c - a * a);
      expectedVal = Math.round(b * 10) / 10;
      aText = a.toString();
      bText = "x";
      cText = c.toString();
      hintText = `💡 <strong>Hint:</strong> Set up: <strong>${a}² + x² = ${c}²</strong>`;
      explanation = `Correct! <strong>${a}² + ${expectedVal}² = ${c}²</strong>`;
    }

    currentProblem = {
      expectedAnswer: expectedVal.toString(),
      hintText: hintText,
      explanation: explanation
    };

    drawTriangle(aText, bText, cText);
    attemptsOnCurrentProblem = 0;
    userInput.value = '';
    resetInputStyle();

    if (!isMobile) {
      userInput.focus();
    }
  }

  function evaluateAnswer(userAnswer) {
    const feedback = document.getElementById('feedback');
    const cleanUser = userAnswer.trim();
    
    const numUser = parseFloat(cleanUser);
    const numExpected = parseFloat(currentProblem.expectedAnswer);
    const isCorrect = !isNaN(numUser) && Math.abs(numUser - numExpected) < 0.01;

    attemptsOnCurrentProblem++;

    if (isCorrect) {
      feedback.innerHTML = currentProblem.explanation;
      feedback.className = "feedback correct";
      
      userInput.classList.remove('input-incorrect');
      userInput.classList.add('input-correct');

      if (attemptsOnCurrentProblem === 1) {
        total++;
        correct++;
        streak++;
      } else {
        streak++;
      }
      
      updateStats();
      setTimeout(() => {
        feedback.innerHTML = "";
        generateProblem();
      }, 1600);
    } else {
      userInput.classList.remove('input-correct');
      userInput.classList.add('input-incorrect');

      if (attemptsOnCurrentProblem === 1) {
        // First wrong attempt: Show substituted equation hint
        feedback.innerHTML = currentProblem.hintText;
        feedback.className = "feedback incorrect";
        
        total++;
        incorrect++;
        streak = 0;
        updateStats();
      } else {
        // Second (or subsequent) wrong attempt: Reveal answer
        feedback.innerHTML = `Incorrect. Correct answer is x = <strong>${currentProblem.expectedAnswer}</strong>`;
        feedback.className = "feedback incorrect";
        
        streak = 0;
        updateStats();
      }
    }
  }

  function updateStats() {
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('totalVal').textContent = total;
    document.getElementById('correctVal').textContent = correct;
    document.getElementById('incorrectVal').textContent = incorrect;
  }

  // Keypad Event Handlers
  document.querySelectorAll('.key-btn[data-val]').forEach(button => {
    button.addEventListener('click', function() {
      resetInputStyle();
      const val = this.getAttribute('data-val');
      if (val === '.' && userInput.value.includes('.')) return;
      
      userInput.value += val;
      if (!isMobile) userInput.focus();
    });
  });

  document.getElementById('backspaceBtn').addEventListener('click', function() {
    resetInputStyle();
    userInput.value = userInput.value.slice(0, -1);
    if (!isMobile) userInput.focus();
  });

  userInput.addEventListener('input', resetInputStyle);

  // Submit Logic
  document.getElementById('answerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (userInput.value.trim() === '') return;
    evaluateAnswer(userInput.value);
  });

  generateProblem();
</script>

</body>
</html>
